org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --illegal-access=permit --add-opens=java.base/java.io=ALL-UNNAMED
org.gradle.caching=true
# TODO: enable this once conventions plugin license processing is configuration cache friendly
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.injected.build.model.v2=true
android.overridePathCheck=true
kotlin.code.style=official
# Kotlin/JVM + wasm compilation runs in the Kotlin daemon; 8g heap (4g Gradle daemon + 8g Kotlin daemon = 12g) fits the Linux runner.
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.native=true
kotlin.native.parallelThreads=8
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false