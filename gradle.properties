org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --illegal-access=permit --add-opens=java.base/java.io=ALL-UNNAMED
org.gradle.caching=true
# TODO: enable this once conventions plugin license processing is configuration cache friendly
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.injected.build.model.v2=true
android.overridePathCheck=true
kotlin.code.style=official
# Keep JVM/Android/Desktop compilation heap at its previous level: the Gradle daemon was
# trimmed (below) to make room for the forked 10g Kotlin/Native JVM, and the Kotlin/JVM
# daemon would otherwise inherit the daemon's smaller heap.
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.native=true
kotlin.native.parallelThreads=8
# Fork the Kotlin/Native compiler into its own JVM (default: in-process inside the Gradle daemon,
# where kotlin.native.jvmArgs cannot apply). Required so the -Xmx10g below is actually honored
# during :linkReleaseFrameworkIosArm64 (devirtualization constraint graph OOMs otherwise).
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx10g -XX:MaxMetaspaceSize=512m
org.jetbrains.compose.experimental.jscanvas.enabled=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.enableKlibsCrossCompilation=false