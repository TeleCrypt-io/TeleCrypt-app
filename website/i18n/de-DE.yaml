features:
  title: Funktionen
  feature1:
    title: Datenschutzorientiert
    desc: Legt Wert auf den Schutz der Privatsphäre der Nutzer durch Ende-zu-Ende-Verschlüsselung und minimale Datenspeicherung.
  feature2:
    title: Einfach
    desc: Intuitive Benutzeroberfläche mit modernem Design und erklärenden Anleitungen innerhalb der App.
  feature3:
    title: Schnell
    desc: Ein Messenger, der sich dank Compose Multiplatform wie eine native App anfühlt.
  feature4:
    title: Zuverlässig
    desc: Verwendet das dezentrale Matrix-Protokoll, das eine hohe Widerstandsfähigkeit gegen Serverausfälle gewährleistet.
  feature5:
    title: Plattformübergreifend
    desc: Auf den meisten Plattformen verfügbar.
  feature6:
    title: Anpassbar
    desc: Entwickler können mit einem sofort einsatzbereiten Messenger starten, der an ihre Anforderungen angepasst werden kann.

